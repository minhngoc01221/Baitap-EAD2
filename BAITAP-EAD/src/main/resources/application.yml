# Cấu hình mặc định dùng MySQL; ${TEN_BIEN:mac_dinh} cho phép ghi đè bằng biến môi trường.
spring:
  profiles:
    # Không chọn profile thì dùng XAMPP; demo và mysql-local vẫn có thể chọn riêng.
    default: xampp
  application:
    name: shop-api
  # Trường tùy chọn không có giá trị được bỏ khỏi JSON, phù hợp schema OpenAPI không nullable.
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop_api?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
springdoc:
  swagger-ui:
    url: /shop-api.yaml
server:
  error:
    include-message: never
