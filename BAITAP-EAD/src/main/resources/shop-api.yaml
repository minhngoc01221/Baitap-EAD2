      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                name: Nova Mechanical K75
                description: Ban phim co khong day
                price: 750000
                stock: 30
                categoryId: 1
                categoryName: Ban phim
                imageUrl: /images/keyboard.svg
        '400':
          description: Error 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: BUSINESS_RULE
                message: Request could not be completed
                details: []
        '401':
          description: Error 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHORIZED
                message: Request could not be completed
                details: []
        '403':
          description: Error 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Request could not be completed
                details: []
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: BUSINESS_RULE
                message: Request could not be completed
                details: []
        '422':
          description: Error 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: BUSINESS_RULE
                message: Request could not be completed
                details: []
        '500':
          description: Error 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INTERNAL_ERROR
                message: Request could not be completed
                details: []
