            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: BUSINESS_RULE
                message: Business rule violated
                details: []
        '500':
          description: Error 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INTERNAL_ERROR
                message: Request could not be completed
                details: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: sort
          in: query
          description: 'One allowed field and asc/desc; e.g. price,desc. Default id,asc.'
          schema:
            type: string
            default: 'id,asc'
            example: 'id,asc'
