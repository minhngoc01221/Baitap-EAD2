          maxLength: 150
          example: an@example.com
        address:
          type: string
          minLength: 5
          maxLength: 255
          example: '123 Nguyen Trai, TP HCM'
        phone:
          type: string
          example: "0901234567"
          pattern: '^\+?[0-9]{9,15}$'
          minLength: 9
          maxLength: 16
      required:
        - name
        - email
        - address
        - phone
    Customer:
      type: object
