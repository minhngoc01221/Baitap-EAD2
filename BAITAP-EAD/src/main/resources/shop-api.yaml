            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
              example:
                content:
                  - id: 1
                    name: Nguyen Van An
                    email: demo@shop.local
                    address: '123 Nguyen Trai, TP HCM'
                    phone: "0901234567"
                page: 0
                size: 10
                totalElements: 1
                totalPages: 1
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Invalid request
                details: []
        '401':
          description: Error 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHORIZED
                message: Request could not be completed
                details: []
        '403':
          description: Error 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Request could not be completed
                details: []
        '404':
          description: Resource not found
