# Single Source of Truth: OpenAPI fullstack.
openapi: 3.0.3
info:
  title: Shop API
  version: 2.0.0
  description: >-
    Fullstack Shop API. Authentication uses expiring Bearer sessions. Customer access is limited to own profile/orders;
    administrators manage catalog and order status. PENDING -> PAID -> SHIPPED; cancel from PENDING or PAID, restoring
    stock. Money: VND.
servers:
  - url: 'http://localhost:8080/api/v1'
    description: Spring Boot
  - url: 'http://localhost:4010'
    description: 'Prism mock (paths start at /customers, /products, /orders)'
tags:
  - name: Accounts
  - name: Categories
  - name: Customers
  - name: Products
  - name: Orders
paths:
